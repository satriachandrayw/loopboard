[project]
name = "loopboard-connectors"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
loopboard = "loopboard_connectors.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopboard_connectors"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
